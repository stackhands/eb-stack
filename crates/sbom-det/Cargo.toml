[package]
name = "sbom-det"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Deterministic CycloneDX documents: no clock, no random serial"
license = "MIT"
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
repository = "https://github.com/stackhands/eb-stack"
publish = false

[dependencies]
cyclonedx-bom = "0.8"
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["v5"] }

[dev-dependencies]
serde_json = "1"
